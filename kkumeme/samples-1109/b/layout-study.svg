 Sans CJK JP,sans-serif">この貝を切手にしたよ</text><text x="179" y="716" font-size="20" font-weight="400" fill="#3b2618" font-family="Noto Sans CJK KR,Noto Sans CJK JP,sans-serif">下の切手も、はがせる。</text><text x="26" y="782" font-size="20" font-weight="400" fill="#3b2618" font-family="Noto Sans CJK KR,Noto Sans CJK JP,sans-serif">架空のサンプル · kkumeme</text></svg>