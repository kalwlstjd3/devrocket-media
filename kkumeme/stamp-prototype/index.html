<title>꾸밈 우표 만들기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;600;700&display=swap">
<style>
/* layout: phone-first single column — step bar, stage (viewfinder / stamp / page), controls tray */
:root{
  --bg:#FFF9EE; --surface:#ffffff; --ink:#2b2134; --muted:#7b6e86; --line:#eadfce;
  --brand:#493165; --brand-ink:#ffffff; --sun:#FFE483; --shade:rgba(43,33,52,.55);
  --display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,sans-serif;
  --hand:"Gaegu","Noto Sans KR",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1c1622; --surface:#271f2f; --ink:#f3ecf7; --muted:#b3a6bd; --line:#3a3044;
  --brand:#c9b3e6; --brand-ink:#1c1622; --sun:#ffe483; --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c1622; --surface:#271f2f; --ink:#f3ecf7; --muted:#b3a6bd; --line:#3a3044;
  --brand:#c9b3e6; --brand-ink:#1c1622; --sun:#ffe483; --shade:rgba(0,0,0,.6); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-family:var(--display);font-weight:400;font-size:24px;margin:0;color:var(--brand);letter-spacing:.5px}
.tag{font-size:12px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.steps button{font:inherit;font-size:13px;padding:8px 4px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.steps button[aria-current="step"]{border-color:var(--brand);color:var(--brand);font-weight:700}
.stage{position:relative;border-radius:18px;overflow:hidden;background:#111;aspect-ratio:3/4;max-width:100%;touch-action:none;user-select:none}
.stage video,.stage canvas.view{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#editStage{background:transparent;overflow:visible;aspect-ratio:3/4.4}
.mask{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hint{position:absolute;left:0;right:0;top:12px;text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.shutter-row{display:flex;align-items:center;justify-content:center;gap:18px;padding-top:6px}
.btn{font:inherit;font-weight:600;border:0;border-radius:14px;padding:12px 16px;cursor:pointer;background:var(--surface);color:var(--ink);box-shadow:0 0 0 1.5px var(--line) inset}
.btn.primary{background:var(--brand);color:var(--brand-ink);box-shadow:none}
.shutter{appearance:none;flex:none;box-sizing:border-box;width:68px;height:68px;border-radius:50%;border:3px solid var(--brand);background:var(--sun);background-clip:content-box;padding:4px;cursor:pointer}
.btn:focus-visible,.shutter:focus-visible,.steps button:focus-visible,.chip:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.note{font-size:12.5px;color:var(--muted);line-height:1.55;margin:0}
.panel{background:var(--surface);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 0 0 1.5px var(--line) inset}
.row{display:grid;grid-template-columns:64px 1fr;align-items:center;gap:10px}
.row>span{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;padding:6px 11px;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:var(--brand-ink)}
.swatch{width:28px;height:28px;padding:0;border-radius:50%}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--brand)}
input[type=text]{font:inherit;width:100%;min-width:0;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--brand)}
.meta{font-size:12px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.page{position:relative;border-radius:18px;aspect-ratio:480/700;max-width:100%;overflow:hidden;background:#fdf6e9;box-shadow:0 0 0 1.5px var(--line) inset}
.page .bgdots{position:absolute;inset:0;background-image:radial-gradient(#e8d9c2 1.4px,transparent 1.5px);background-size:22px 22px}
.page .title{position:absolute;left:8%;top:6%;font-family:var(--hand);font-weight:700;font-size:clamp(22px,7vw,34px);color:#3b2618}
.page .memo{position:absolute;left:8%;top:72%;width:60%;font-family:var(--hand);font-size:clamp(16px,4.6vw,22px);color:#5a4636;line-height:1.3}
.page img.st{position:absolute;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25));touch-action:none;cursor:grab}
.page img.st:active{cursor:grabbing}
.mini{position:absolute;right:6%;top:9%;width:20%;transform:rotate(9deg);filter:drop-shadow(0 3px 5px rgba(0,0,0,.2))}
.hidden-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>우표 만들기</h1>
    <span class="tag">꾸밈 프로토타입 · 실제 서비스 아님</span>
  </header>

  <nav class="steps" aria-label="단계">
    <button id="tab-shoot" data-step="shoot">1 찍기</button>
    <button id="tab-edit" data-step="edit">2 꾸미기</button>
    <button id="tab-page" data-step="page">3 붙여 보기</button>
  </nav>

  <!-- 1. 찍기 -->
  <section id="step-shoot" class="step" aria-label="찍기">
    <div class="stage" id="viewfinder">
      <video id="video" playsinline muted hidden></video>
      <canvas class="view" id="still"></canvas>
      <canvas class="mask" id="mask"></canvas>
      <div class="hint" id="vfHint">사진을 끌어서 맞추기 · 두 손가락으로 크기</div>
    </div>
    <div class="shutter-row">
      <button class="btn" id="pickAlbum">앨범</button>
      <button class="shutter" id="shutter" aria-label="찍기"></button>
      <button class="btn" id="camToggle">카메라 켜기</button>
    </div>
    <p class="note" id="camNote">점선 안이 오려져 우표가 돼요. 사진을 끌어서 맞추고 가운데 버튼. 지금은 예시 사진이 들어 있어요.</p>
    <input class="hidden-input" type="file" id="fileAlbum" accept="image/*">
    <input class="hidden-input" type="file" id="fileCam" accept="image/*" capture="environment">
  </section>

  <!-- 2. 꾸미기 -->
  <section id="step-edit" class="step" aria-label="꾸미기" hidden>
    <div class="stage" id="editStage"><canvas class="view" id="editView" aria-label="사진에서 오려낸 우표"></canvas></div>
    <p class="meta" id="meta"></p>
    <div class="panel">
      <div class="row"><span>모양</span><div class="chips" id="optShape"></div></div>
      <div class="row"><span>테두리</span><div class="chips" id="optMargin"></div></div>
      <div class="row"><span>톱니</span><div class="chips" id="optTeeth"></div></div>
      <div class="row"><span>종이</span><div class="chips" id="optPaper"></div></div>
      <div class="row"><span>색감</span><div class="chips" id="optTone"></div></div>
      <div class="row"><span>문구</span><input type="text" id="caption" maxlength="16"></div>
      <div class="row"><span>글씨</span><div class="chips" id="optFont"></div></div>
      <div class="row"><span>소인</span><div class="chips" id="optMark"></div></div>
    </div>
    <button class="btn primary" id="toPage">지퍼백에 담고 붙여 보기</button>
  </section>

  <!-- 3. 붙여 보기 -->
  <section id="step-page" class="step" aria-label="붙여 보기" hidden>
    <div class="page" id="page">
      <div class="bgdots"></div>
      <div class="title">가을 산책 기록</div>
      <div class="memo">오늘 하늘이 너무 예뻐서 우표로 붙여 둠 ✿</div>
    </div>
    <p class="note">우표는 투명 배경 PNG 스티커예요. 끌어서 옮겨 보세요. 실제 공개 페이지에서는 스티커처럼 떼었다 붙일 수 있어요.</p>
    <div class="shutter-row">
      <button class="btn" id="again">하나 더 만들기</button>
      <button class="btn" id="backEdit">다시 꾸미기</button>
    </div>
  </section>
</div>


<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const S = {
    shape: "portrait", margin: "none", teeth: "small", paper: "#fffdf7", tone: "vintage",
    caption: "", font: "hand", mark: false,
    img: null, panX: 0, panY: 0, zoom: 1, stream: null, made: 0,
  };
  const SHAPES = { portrait: [3, 4, "세로"], landscape: [4, 3, "가로"], square: [1, 1, "정사각"] };
  const MARGINS = { none: [0, "사진 끝까지"], thin: [0.045, "얇게"], wide: [0.09, "넓게"] };
  const TEETH = { small: [0.015, "잘게"], mid: [0.028, "보통"], big: [0.042, "크게"] };
  const PAPERS = [["#fffdf7", "흰 종이"], ["#f6ead2", "크림"], ["#dcebf5", "하늘"], ["#f7dde3", "분홍"], ["#dcefe3", "민트"]];
  const TONES = { none: "원본", vintage: "빈티지", film: "필름" };
  const FONTS = { hand: ["개구체", '700 1em "Gaegu"'], bold: ["검은고딕", '400 1em "Black Han Sans"'] };
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const mk = (w, h) => { const c = document.createElement("canvas"); c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h)); return c; };
  const today = () => { const d = new Date(); return `${String(d.getDate()).padStart(2, "0")}.${String(d.getMonth() + 1).padStart(2, "0")} · ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };

  // ---------- sample photo (drawn, so the page opens in a working state) ----------
  function samplePhoto() {
    const c = mk(900, 1200), g = c.getContext("2d");
    const sky = g.createLinearGradient(0, 0, 0, 1200);
    sky.addColorStop(0, "#9cc9e8"); sky.addColorStop(.55, "#f7d9b8"); sky.addColorStop(1, "#e9b48f");
    g.fillStyle = sky; g.fillRect(0, 0, 900, 1200);
    g.fillStyle = "#fff4cf"; g.beginPath(); g.arc(640, 430, 90, 0, Math.PI * 2); g.fill();
    const hill = (y, col, amp, ph) => { g.fillStyle = col; g.beginPath(); g.moveTo(0, 1200);
      for (let x = 0; x <= 900; x += 20) g.lineTo(x, y + Math.sin(x / 140 + ph) * amp); g.lineTo(900, 1200); g.fill(); };
    hill(760, "#b98a74", 40, 1); hill(860, "#8f6a5b", 50, 3); hill(980, "#5f4a43", 30, 5);
    g.fillStyle = "#3b2f2c"; for (const [x, h] of [[180, 160], [240, 120], [700, 180]]) { g.fillRect(x - 6, 980 - h, 12, h);
      g.beginPath(); g.arc(x, 980 - h, 46, 0, Math.PI * 2); g.fill(); }
    g.fillStyle = "rgba(255,255,255,.75)"; for (const [x, y, s] of [[160, 250, 1], [420, 180, .7]]) {
      g.beginPath(); g.ellipse(x, y, 90 * s, 26 * s, 0, 0, 7); g.fill(); g.beginPath(); g.ellipse(x + 40 * s, y - 18 * s, 50 * s, 26 * s, 0, 0, 7); g.fill(); }
    return c;
  }

  // linen card paper (also what shows through the hole)
  const PAPERTEX = (() => {
    const N = 320, c = mk(N, N), g = c.getContext("2d");
    g.fillStyle = "#e9e5dd"; g.fillRect(0, 0, N, N);
    for (let k = 0; k < 18; k++) { const x = Math.random() * N, y = Math.random() * N, r = 30 + Math.random() * 70;
      const rg = g.createRadialGradient(x, y, 0, x, y, r); rg.addColorStop(0, Math.random() < .5 ? "rgba(255,255,255,.09)" : "rgba(90,80,70,.025)"); rg.addColorStop(1, "rgba(0,0,0,0)");
      g.fillStyle = rg; for (const ox of [-N, 0, N]) for (const oy of [-N, 0, N]) { g.save(); g.translate(ox, oy); g.fillRect(-ox, -oy, N, N); g.restore(); } }
    g.fillStyle = "rgba(80,70,60,.05)"; for (let i = 0; i < N; i += 3) { g.fillRect(0, i, N, 1); g.fillRect(i, 0, 1, N); }
    const d = g.getImageData(0, 0, N, N), p = d.data;
    for (let i = 0; i < p.length; i += 4) { const n = (Math.random() - .5) * 20; p[i] += n; p[i + 1] += n; p[i + 2] += n; }
    g.putImageData(d, 0, 0); return c;
  })();

  // ---------- geometry: one photo transform shared by every stage ----------
  function stampSize(base) {
    const [w, h] = SHAPES[S.shape]; const k = base / Math.max(w, h);
    return { W: Math.round(w * k), H: Math.round(h * k) };
  }
  // photo cover-fitted to a w×h stage; pan is a fraction of the stage so all stages agree
  function cover(w, h, img) {
    const iw = img.videoWidth || img.width, ih = img.videoHeight || img.height;
    const s = Math.max(w / iw, h / ih) * S.zoom, dw = iw * s, dh = ih * s;
    const mx = (dw - w) / 2 / w, my = (dh - h) / 2 / h;
    S.panX = clamp(S.panX, -mx, mx); S.panY = clamp(S.panY, -my, my);
    return { x: (w - dw) / 2 + S.panX * w, y: (h - dh) / 2 + S.panY * h, w: dw, h: dh, s };
  }
  function frameRect(w, h) {
    const [sw, sh] = SHAPES[S.shape]; const k = Math.min(w * .56 / sw, h * .5 / sh);
    const fw = sw * k, fh = sh * k; return { x: (w - fw) / 2, y: (h - fh) / 2 - h * .02, w: fw, h: fh };
  }
  // the photo region under the frame, in source pixels (reference stage 300×400)
  function crop() {
    const c = cover(300, 400, S.img), f = frameRect(300, 400);
    return { sx: (f.x - c.x) / c.s, sy: (f.y - c.y) / c.s, sw: f.w / c.s, sh: f.h / c.s };
  }

  // perforated outline: rectangle minus half-circles along every edge
  // hole centres along every edge (corners included)
  function holes(W, H, t) {
    const out = [], step = t * 2.6;
    const edge = (len, f) => { const n = Math.max(2, Math.round(len / step)); for (let i = 0; i <= n; i++) f(i * len / n); };
    edge(W, (x) => { out.push([x, 0], [x, H]); }); edge(H, (y) => { out.push([0, y], [W, y]); });
    return out;
  }
  // perforated outline: rectangle minus circles centred on the edges
  function perforate(g, W, H, t) {
    g.save(); g.globalCompositeOperation = "destination-out"; g.beginPath();
    for (const [x, y] of holes(W, H, t)) { g.moveTo(x + t, y); g.arc(x, y, t, 0, Math.PI * 2); }
    g.fill(); g.restore();
  }
  const teeth = (W, H) => TEETH[S.teeth][0] * Math.max(W, H);
  // solid stamp silhouette at a given size (same rule as the stamp itself)
  function shapeCanvas(W, H) {
    const c = mk(W, H), g = c.getContext("2d"); g.fillStyle = "#000"; g.fillRect(0, 0, c.width, c.height);
    perforate(g, c.width, c.height, teeth(c.width, c.height)); return c;
  }

  function applyTone(g, r) {
    if (S.tone === "none" || r.w < 1 || r.h < 1) return;
    const d = g.getImageData(r.x | 0, r.y | 0, Math.ceil(r.w), Math.ceil(r.h)), p = d.data;
    for (let i = 0; i < p.length; i += 4) {
      let R = p[i], G = p[i + 1], B = p[i + 2];
      if (S.tone === "vintage") { const L = .3 * R + .59 * G + .11 * B;
        R = R * .72 + L * .28 + 14; G = G * .72 + L * .28 + 6; B = B * .72 + L * .28 - 10; }
      else { R = R * 1.05 + 4; G = G * .98 + 6; B = B * .9 + 18; }
      const n = (Math.random() - .5) * 18; p[i] = R + n; p[i + 1] = G + n; p[i + 2] = B + n;
    }
    g.putImageData(d, r.x | 0, r.y | 0);
  }
  function paperGrain(g, W, H) {
    const d = g.getImageData(0, 0, W, H), p = d.data;
    for (let i = 0; i < p.length; i += 4) { const n = (Math.random() - .5) * 10; p[i] += n; p[i + 1] += n; p[i + 2] += n; }
    g.putImageData(d, 0, 0);
  }
  function postmark(g, W, H) {
    const R = Math.min(W, H) * .2, cx = W - R * .9, cy = R * 1.05;
    g.save(); g.strokeStyle = "rgba(48,40,70,.62)"; g.fillStyle = "rgba(48,40,70,.62)"; g.lineWidth = Math.max(2, R * .06);
    g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2); g.stroke();
    g.beginPath(); g.arc(cx, cy, R * .72, 0, Math.PI * 2); g.stroke();
    g.font = `700 ${R * .3}px "Noto Sans KR"`; g.textAlign = "center"; g.textBaseline = "middle";
    const d = new Date(); g.fillText(`${d.getMonth() + 1}.${d.getDate()}`, cx, cy);
    const word = "KKUME·ME"; g.font = `700 ${R * .2}px "Noto Sans KR"`;
    [...word].forEach((ch, i) => { const a = -Math.PI * .85 + i * (Math.PI * .7 / (word.length - 1));
      g.save(); g.translate(cx + Math.cos(a) * R * .86, cy + Math.sin(a) * R * .86); g.rotate(a + Math.PI / 2); g.fillText(ch, 0, 0); g.restore(); });
    for (let k = 0; k < 4; k++) { g.beginPath(); const y = cy + (k - 1.5) * R * .22;
      g.moveTo(cx - R * 2.75, y); g.bezierCurveTo(cx - R * 2.2, y - R * .12, cx - R * 1.6, y + R * .12, cx - R * 1.05, y); g.stroke(); }
    g.restore();
  }

  // the stamp = exactly the photo region inside the frame, with a thin paper lip at the teeth
  function renderStamp(canvas, base) {
    const { W, H } = stampSize(base);
    canvas.width = W; canvas.height = H;
    const g = canvas.getContext("2d", { willReadFrequently: true });
    const t = teeth(W, H), lip = t * .45, mg = MARGINS[S.margin][0] * Math.min(W, H) + lip;
    const cap = S.caption.trim(), band = cap && S.margin !== "none" ? Math.min(W, H) * .13 : 0;
    g.fillStyle = S.paper; g.fillRect(0, 0, W, H);
    const pr = { x: mg, y: mg, w: W - mg * 2, h: H - mg * 2 - band };
    if (S.img) { const k = crop(); g.save(); g.beginPath(); g.rect(pr.x, pr.y, pr.w, pr.h); g.clip();
      g.drawImage(S.img, k.sx, k.sy, k.sw, k.sh, 0, 0, W, H); g.restore(); }
    applyTone(g, pr);
    if (S.margin !== "none") { g.strokeStyle = "rgba(0,0,0,.16)"; g.lineWidth = 1; g.strokeRect(pr.x + .5, pr.y + .5, pr.w - 1, pr.h - 1); }
    if (cap) {
      const [, font] = FONTS[S.font];
      if (band) { g.fillStyle = "#3b2618"; g.textAlign = "center"; g.textBaseline = "middle";
        g.font = font.replace("1em", `${Math.round(band * (S.font === "hand" ? .78 : .6))}px`);
        g.fillText(cap, W / 2, pr.y + pr.h + band * .55, pr.w); }
      else { const fs = Math.round(Math.min(W, H) * (S.font === "hand" ? .085 : .065));
        g.save(); g.font = font.replace("1em", `${fs}px`); g.textAlign = "left"; g.textBaseline = "alphabetic";
        g.shadowColor = "rgba(0,0,0,.45)"; g.shadowBlur = fs * .25; g.fillStyle = "#fffaf0";
        g.fillText(cap, pr.x + fs * .5, pr.y + pr.h - fs * .55, pr.w - fs); g.restore(); }
    }
    if (S.mark) postmark(g, W, H);
    paperGrain(g, W, H);
    perforate(g, W, H, t);
    return { W, H };
  }

  // ---------- step 1: viewfinder (whole photo, dashed cut line, outside dimmed) ----------
  const still = $("still"), mask = $("mask"), video = $("video"), vf = $("viewfinder");
  function sizeTo(c, host) { const b = host.getBoundingClientRect(), d = devicePixelRatio || 1;
    c.width = Math.max(1, Math.round(b.width * d)); c.height = Math.max(1, Math.round(b.height * d)); return { w: c.width, h: c.height, d }; }
  function paintPhoto(g, w, h, src) {
    g.fillStyle = "#222"; g.fillRect(0, 0, w, h);
    if (!src) return; const c = cover(w, h, src); g.drawImage(src, c.x, c.y, c.w, c.h);
  }
  function drawViewfinder() {
    const { w, h, d } = sizeTo(still, vf); sizeTo(mask, vf);
    paintPhoto(still.getContext("2d"), w, h, S.stream ? video : S.img);
    const fr = frameRect(w, h), shp = shapeCanvas(fr.w, fr.h);
    const m = mask.getContext("2d"); m.clearRect(0, 0, w, h);
    m.fillStyle = "rgba(20,14,26,.5)"; m.fillRect(0, 0, w, h);
    m.globalCompositeOperation = "destination-out"; m.drawImage(shp, fr.x, fr.y); m.globalCompositeOperation = "source-over";
    // cut line: an even stroke just inside the perforated edge (vector, so every tooth is identical)
    const L = 1.5 * d, t = teeth(fr.w, fr.h), hs = holes(fr.w, fr.h, t);
    const ring = mk(w, h), r = ring.getContext("2d");
    r.translate(fr.x, fr.y); r.strokeStyle = "#fff"; r.lineWidth = L * 2;
    r.save(); r.beginPath(); r.rect(0, 0, fr.w, fr.h); r.clip();
    r.strokeRect(0, 0, fr.w, fr.h);
    r.beginPath(); for (const [x, y] of hs) { r.moveTo(x + t, y); r.arc(x, y, t, 0, Math.PI * 2); } r.stroke(); r.restore();
    r.globalCompositeOperation = "destination-out"; r.beginPath();
    for (const [x, y] of hs) { r.moveTo(x + t, y); r.arc(x, y, t, 0, Math.PI * 2); } r.fill();
    m.drawImage(ring, 0, 0);
    if (S.stream) requestAnimationFrame(drawLive);
  }
  function drawLive() {
    if (!S.stream) return;
    paintPhoto(still.getContext("2d"), still.width, still.height, video);
    requestAnimationFrame(drawLive);
  }

  async function startCamera() {
    const note = $("camNote");
    if (S.stream) { stopCamera(); note.textContent = "카메라를 껐어요. 앨범이나 예시 사진으로 만들 수 있어요."; return; }
    try {
      if (!navigator.mediaDevices?.getUserMedia) throw new Error("no api");
      S.stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1920 } }, audio: false });
      video.srcObject = S.stream; await video.play(); S.panX = S.panY = 0; S.zoom = 1;
      $("camToggle").textContent = "카메라 끄기"; $("vfHint").textContent = "점선 안에 맞추고 가운데 버튼";
      note.textContent = "실제 카메라 화면이에요. 점선 안이 오려져 우표가 돼요.";
      drawViewfinder();
    } catch {
      S.stream = null;
      note.textContent = "이 미리보기 창에서는 카메라를 바로 켤 수 없어요. 대신 휴대폰 카메라 앱으로 찍어서 가져올게요. 실제 꾸밈에서는 이 화면에 카메라가 나오고 점선이 겹쳐 보여요.";
      $("fileCam").click();
    }
  }
  function stopCamera() { S.stream?.getTracks().forEach((t) => t.stop()); S.stream = null; video.srcObject = null;
    $("camToggle").textContent = "카메라 켜기"; $("vfHint").textContent = "사진을 끌어서 맞추기 · 두 손가락으로 크기"; drawViewfinder(); }

  function shoot() {
    if (S.stream) { const c = mk(video.videoWidth, video.videoHeight); c.getContext("2d").drawImage(video, 0, 0);
      S.img = c; S.panX = S.panY = 0; S.zoom = 1; stopCamera(); }
    go("edit", true);
  }
  function loadFile(file) {
    if (!file) return;
    const im = new Image();
    im.onload = () => { S.img = im; S.panX = S.panY = 0; S.zoom = 1; drawViewfinder();
      $("camNote").textContent = "사진을 끌어서 점선 안에 맞춘 뒤 가운데 버튼을 눌러요."; };
    im.src = URL.createObjectURL(file);
  }
  function attachGestures(el, redraw) {
    const pts = new Map(); let last = null;
    el.addEventListener("pointerdown", (e) => { el.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); });
    el.addEventListener("pointermove", (e) => {
      if (!pts.has(e.pointerId) || S.stream) return;
      const prev = pts.get(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
      if (pts.size === 1) { S.panX += (e.clientX - prev[0]) / el.clientWidth; S.panY += (e.clientY - prev[1]) / el.clientHeight; }
      else { const [a, b] = [...pts.values()]; const dist = Math.hypot(a[0] - b[0], a[1] - b[1]);
        if (last) S.zoom = clamp(S.zoom * dist / last, 1, 4); last = dist; }
      redraw();
    });
    const end = (e) => { pts.delete(e.pointerId); if (pts.size < 2) last = null; };
    el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
    el.addEventListener("wheel", (e) => { e.preventDefault(); S.zoom = clamp(S.zoom * (e.deltaY < 0 ? 1.08 : .93), 1, 4); redraw(); }, { passive: false });
  }

  // ---------- step 2: a paper card — the photo with its hole below, the stamp set on the paper above ----------
  const editView = $("editView"), editStage = $("editStage");
  let anim = 0, cache = null;
  function grain(g, x, y, w, h, amt) {
    const d = g.getImageData(x | 0, y | 0, Math.ceil(w), Math.ceil(h)), p = d.data;
    for (let i = 0; i < p.length; i += 4) { const n = (Math.random() - .5) * amt; p[i] += n; p[i + 1] += n; p[i + 2] += n; }
    g.putImageData(d, x | 0, y | 0);
  }
  function crease(g, y, w, d) {
    g.save(); g.lineWidth = d;
    for (const [col, off] of [["rgba(70,60,50,.13)", 0], ["rgba(255,255,255,.55)", d]]) {
      g.strokeStyle = col; g.beginPath(); g.moveTo(0, y + off);
      for (let x = 0; x <= w; x += w / 8) g.lineTo(x, y + off + Math.sin(x * .013 + y) * d * 1.2);
      g.stroke(); }
    g.restore();
  }
  function buildEdit() {
    const { w, h, d } = sizeTo(editView, editStage);
    const CW = w * .88, CH = h * .92, PH = CW * .72, paperH = CH - PH;
    const card = mk(CW, CH), c = card.getContext("2d", { willReadFrequently: true });
    c.fillStyle = c.createPattern(PAPERTEX, "repeat"); c.fillRect(0, 0, CW, CH);
    crease(c, paperH * .22, CW, d); crease(c, paperH * .74, CW, d);
    // photo window straight from the source image, framed around the cut region
    const src = S.img, iw = src.width, ih = src.height, k0 = crop();
    const k = Math.max(CW * .4 / k0.sw, CW / iw, PH / ih), vw = CW / k, vh = PH / k;
    const sx0 = clamp(k0.sx + k0.sw / 2 - vw / 2, 0, iw - vw), sy0 = clamp(k0.sy + k0.sh / 2 - vh / 2, 0, ih - vh);
    c.drawImage(src, sx0, sy0, vw, vh, 0, paperH, CW, PH);
    grain(c, 0, paperH, CW, PH, 26);
    const hr = { x: (k0.sx - sx0) * k, y: paperH + (k0.sy - sy0) * k, w: k0.sw * k, h: k0.sh * k };
    const shp = shapeCanvas(hr.w, hr.h);
    const hole = mk(CW, CH), l = hole.getContext("2d");
    l.drawImage(shp, hr.x, hr.y); l.globalCompositeOperation = "source-in";
    l.fillStyle = l.createPattern(PAPERTEX, "repeat"); l.fillRect(0, 0, CW, CH);
    const out = mk(CW, CH), o = out.getContext("2d"); o.fillRect(0, 0, CW, CH);
    o.globalCompositeOperation = "destination-out"; o.drawImage(shp, hr.x, hr.y);
    l.globalCompositeOperation = "source-atop"; l.shadowColor = "rgba(45,35,25,.45)"; l.shadowBlur = 6 * d; l.shadowOffsetY = 2 * d;
    l.drawImage(out, 0, 0);
    const st = mk(1, 1); renderStamp(st, Math.max(hr.w, hr.h));
    const se = Math.min(1, paperH * .66 / st.height, CW * .7 / st.width);
    cache = { w, h, d, CW, CH, paperH, card, hole, st, hr, se };
  }
  function paintEdit(lift) {
    if (!cache) return;
    const { w, h, d, CW, CH, paperH, card, hole, st, hr, se } = cache, g = editView.getContext("2d");
    const comp = mk(CW, CH), c = comp.getContext("2d");
    c.drawImage(card, 0, 0);
    c.globalAlpha = clamp(lift * 5, 0, 1); c.drawImage(hole, 0, 0); c.globalAlpha = 1;
    const sx = hr.x + hr.w / 2, sy = hr.y + hr.h / 2, ex = CW / 2, ey = paperH * .56;
    const cx = sx + (ex - sx) * lift, cy = sy + (ey - sy) * lift - Math.sin(lift * Math.PI) * paperH * .12;
    const sc = 1 + (se - 1) * lift + Math.sin(lift * Math.PI) * .06;
    const sw = st.width * sc, sh = st.height * sc;
    c.save(); c.shadowColor = `rgba(30,22,14,${.22 + Math.sin(lift * Math.PI) * .25})`;
    c.shadowBlur = (4 + Math.sin(lift * Math.PI) * 14) * d; c.shadowOffsetY = (2 + Math.sin(lift * Math.PI) * 8) * d;
    c.drawImage(st, cx - sw / 2, cy - sh / 2, sw, sh); c.restore();
    if (lift > .85) { c.globalAlpha = (lift - .85) / .15; c.fillStyle = "#4a443e";
      c.font = `500 ${11 * d}px "Noto Sans KR", system-ui`; c.textBaseline = "bottom";
      c.fillText(today(), cx - sw / 2 + 2 * d, cy - sh / 2 - 5 * d); c.globalAlpha = 1; }
    g.clearRect(0, 0, w, h);
    g.save(); g.translate(w / 2, h / 2 + h * .005); g.rotate(-.014);
    g.shadowColor = "rgba(40,30,20,.28)"; g.shadowBlur = 18 * d; g.shadowOffsetY = 8 * d;
    g.drawImage(comp, -CW / 2, -CH / 2); g.restore();
  }
  function drawEdit(animate) {
    cancelAnimationFrame(anim); buildEdit();
    if (!animate || matchMedia("(prefers-reduced-motion: reduce)").matches) { paintEdit(1); return; }
    const t0 = performance.now(), dur = 950;
    const tick = (now) => { const p = clamp((now - t0) / dur, 0, 1), e = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
      paintEdit(e); if (p < 1) anim = requestAnimationFrame(tick); };
    paintEdit(0); anim = requestAnimationFrame(tick);
  }
  let pending = 0;
  const redrawEdit = () => { cancelAnimationFrame(pending); pending = requestAnimationFrame(() => drawEdit(false)); };
  function chips(host, entries, key, onPick, swatch) {
    host.replaceChildren();
    for (const [value, label] of entries) {
      const b = document.createElement("button"); b.type = "button"; b.className = "chip" + (swatch ? " swatch" : "");
      b.setAttribute("aria-pressed", String(S[key] === value)); b.setAttribute("aria-label", label);
      if (swatch) { b.style.background = value; b.title = label; } else b.textContent = label;
      b.onclick = () => { S[key] = value; [...host.children].forEach((c) => c.setAttribute("aria-pressed", String(c === b))); onPick(); };
      host.append(b);
    }
  }
  function buildControls() {
    chips($("optShape"), Object.entries(SHAPES).map(([k, v]) => [k, v[2]]), "shape", redrawEdit);
    chips($("optMargin"), Object.entries(MARGINS).map(([k, v]) => [k, v[1]]), "margin", redrawEdit);
    chips($("optTeeth"), Object.entries(TEETH).map(([k, v]) => [k, v[1]]), "teeth", redrawEdit);
    chips($("optPaper"), PAPERS, "paper", redrawEdit, true);
    chips($("optTone"), Object.entries(TONES), "tone", redrawEdit);
    chips($("optFont"), Object.entries(FONTS).map(([k, v]) => [k, v[0]]), "font", redrawEdit);
    chips($("optMark"), [[false, "없음"], [true, "찍기 (2차 후보)"]], "mark", redrawEdit);
    const cap = $("caption"); cap.value = S.caption; cap.oninput = () => { S.caption = cap.value; redrawEdit(); };
    $("meta").textContent = "점선 모양 그대로 오려낸 우표예요. 위치를 바꾸려면 「1 찍기」로 돌아가요.";
  }

  // ---------- step 3: page ----------
  function addToPage() {
    const c = mk(1, 1); renderStamp(c, 900);
    c.toBlob((blob) => {
      if (!blob) return;
      const page = $("page"), img = document.createElement("img");
      img.className = "st"; img.alt = "내가 만든 우표"; img.src = URL.createObjectURL(blob); img.draggable = false;
      const n = S.made++, w = S.shape === "landscape" ? 32 : 24;
      img.style.width = w + "%"; img.style.left = (18 + (n % 3) * 14) + "%"; img.style.top = (20 + (n % 3) * 6) + "%";
      img.style.transform = `rotate(${[-6, 5, -2][n % 3]}deg)`;
      dragIn(img, page); page.append(img); go("page");
    }, "image/png");
  }
  function dragIn(el, box) {
    let s = null;
    el.addEventListener("pointerdown", (e) => { el.setPointerCapture(e.pointerId); s = { x: e.clientX, y: e.clientY, l: el.offsetLeft, t: el.offsetTop }; box.append(el); });
    el.addEventListener("pointermove", (e) => { if (!s) return; const b = box.getBoundingClientRect();
      el.style.left = ((s.l + e.clientX - s.x) / b.width * 100) + "%"; el.style.top = ((s.t + e.clientY - s.y) / b.height * 100) + "%"; });
    const end = () => { s = null; }; el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
  }

  // ---------- navigation ----------
  function go(step, animate) {
    for (const s of ["shoot", "edit", "page"]) { $("step-" + s).hidden = s !== step;
      $("tab-" + s).removeAttribute("aria-current"); if (s === step) $("tab-" + s).setAttribute("aria-current", "step"); }
    if (step === "shoot") requestAnimationFrame(drawViewfinder);
    if (step === "edit") requestAnimationFrame(() => drawEdit(animate));
  }
  document.querySelectorAll(".steps button").forEach((b) => b.onclick = () => go(b.dataset.step, b.dataset.step === "edit"));
  $("pickAlbum").onclick = () => $("fileAlbum").click();
  $("fileAlbum").onchange = (e) => loadFile(e.target.files[0]);
  $("fileCam").onchange = (e) => loadFile(e.target.files[0]);
  $("camToggle").onclick = startCamera;
  $("shutter").onclick = shoot;
  $("toPage").onclick = addToPage;
  $("again").onclick = () => go("shoot");
  $("backEdit").onclick = () => go("edit");
  attachGestures(vf, drawViewfinder);
  addEventListener("resize", () => { if (!$("step-shoot").hidden) drawViewfinder(); else if (!$("step-edit").hidden) drawEdit(false); });

  S.img = samplePhoto();
  buildControls();
  go("shoot");
  document.fonts?.load('700 20px "Gaegu"').then(() => document.fonts.load('20px "Black Han Sans"')).then(() => { if (!$("step-edit").hidden) drawEdit(false); }).catch(() => {});
})();
</script>
